<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000">
<title>Quomor 1.5</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;background:#000;color:#f3f3f3;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
.loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.track{width:min(280px,70vw);height:4px;background:#222;border-radius:2px;overflow:hidden}
.bar{width:0;height:100%;background:#fff;transition:width .15s linear}
.status{color:#999;font:11px ui-monospace,SFMono-Regular,Consolas,monospace;min-height:14px;text-align:center;padding:0 16px}
</style>
</head>
<body>
<div class="loader">
  <div class="track"><div class="bar" id="bar"></div></div>
  <div class="status" id="status" role="status" aria-live="polite"></div>
</div>
<script>
(async()=>{
const CAP=3200*3200,MAX=400*1024*1024;
const DL=6;   // concurrent downloads
const DEC=3;  // decode workers (each peaks ~120 MB; lower to 2 if RAM is tight)
const bar=document.getElementById("bar"),statusEl=document.getElementById("status");
const showErr=m=>{statusEl.textContent="Error: "+String((m&&m.message)||m)};
addEventListener("error",e=>showErr(e.message));
addEventListener("unhandledrejection",e=>showErr(e.reason));

// ---- decoder, runs inside Web Workers (parallel, off the main thread) ----
const workerMain=()=>{
  const W=3200,CAP=W*W,H=24,STEP=1000003,CHUNK=8*1024*1024,M=[67,83,80,51];
  const readAlpha=(rgba,start,count)=>{
    const out=new Uint8Array(count);let p=(start*STEP)%CAP;
    for(let i=0;i<count;i++){out[i]=rgba[p*4+3];p+=STEP;if(p>=CAP)p-=CAP}
    return out;
  };
  const checksum=b=>{let h=0x811c9dc5;for(let i=0;i<b.length;i++){h^=b[i];h=Math.imul(h,0x01000193)}return h>>>0};
  onmessage=async e=>{
    const{n,blob}=e.data;
    try{
      const bitmap=await createImageBitmap(blob);
      if(bitmap.width!==W||bitmap.height!==W){const d=bitmap.width+" × "+bitmap.height;bitmap.close();throw Error(n+".webp is "+d+", expected "+W+" × "+W+".")}
      const canvas=new OffscreenCanvas(W,W);
      const ctx=canvas.getContext("2d",{willReadFrequently:true});
      ctx.drawImage(bitmap,0,0);bitmap.close();
      let rgba=ctx.getImageData(0,0,W,W).data;
      const header=readAlpha(rgba,0,H);
      if(!M.every((v,i)=>header[i]===v))throw Error("No ColorScript data found in "+n+".webp.");
      const v=new DataView(header.buffer);
      const index=v.getUint32(4,false),count=v.getUint32(8,false),rawLength=v.getUint32(12,false),
            compressedLength=v.getUint32(16,false),expected=v.getUint32(20,false);
      if(!count||count>50||index>=count||rawLength>CHUNK||compressedLength>CAP-H)throw Error(n+".webp has invalid data.");
      const packet=readAlpha(rgba,H,compressedLength);
      rgba=null;canvas.width=0;canvas.height=0;
      const stream=new Blob([packet]).stream().pipeThrough(new DecompressionStream("gzip"));
      const raw=new Uint8Array(await new Response(stream).arrayBuffer());
      if(raw.length!==rawLength||checksum(raw)!==expected)throw Error("Part "+n+" failed its integrity check.");
      postMessage({n,index,count,raw:raw.buffer},[raw.buffer]);
    }catch(err){postMessage({n,error:err&&err.message||String(err)})}
  };
};
const workerURL=URL.createObjectURL(new Blob(["("+workerMain.toString()+")()"],{type:"text/javascript"}));
const free=[],waiters=[],pool=[];
for(let k=0;k<DEC;k++){const w=new Worker(workerURL);pool.push(w);free.push(w)}
const acquire=()=>free.length?Promise.resolve(free.pop()):new Promise(r=>waiters.push(r));
const release=w=>{waiters.length?waiters.shift()(w):free.push(w)};
const decode=async(blob,n)=>{
  const w=await acquire();
  try{
    return await new Promise((res,rej)=>{
      w.onmessage=e=>e.data.error?rej(Error(e.data.error)):res(e.data);
      w.onerror=e=>rej(Error(e.message||"Worker failed"));
      w.postMessage({n,blob});
    });
  }finally{release(w)}
};

let expectedCount=0,totalRaw=0,downloaded=0,decoded=0,failed=false;
const parts=new Map();
const setProgress=()=>{
  const total=expectedCount||1;
  bar.style.width=Math.min(1,(downloaded*0.5+decoded*0.5)/total)*100+"%";
  if(expectedCount)statusEl.textContent="downloaded "+downloaded+"/"+expectedCount+" · decoded "+decoded+"/"+expectedCount;
};
const download=async n=>{
  const res=await fetch(n+".webp");
  if(!res.ok)throw Error("Could not load "+n+".webp ("+res.status+").");
  const blob=await res.blob();
  downloaded++;setProgress();
  return blob;
};
const store=({index,count,raw})=>{
  if(expectedCount&&count!==expectedCount)throw Error("Parts belong to different files.");
  if(parts.has(index))throw Error("Duplicate part "+(index+1)+".");
  totalRaw+=raw.byteLength;
  if(totalRaw>MAX)throw Error("Restored HTML exceeds 400 MB.");
  parts.set(index,new Blob([raw]));
  decoded++;setProgress();
};

try{
  const first=await decode(await download(1),1);
  expectedCount=first.count;
  store(first);
  let next=2;
  const runner=async()=>{
    while(!failed){
      const n=next++;
      if(n>expectedCount)return;
      try{store(await decode(await download(n),n))}catch(e){failed=true;throw e}
    }
  };
  await Promise.all(Array.from({length:Math.min(DL,expectedCount-1)},runner));
  for(let i=0;i<expectedCount;i++)if(!parts.has(i))throw Error("Missing part "+(i+1)+".");
  bar.style.width="100%";
}catch(error){
  failed=true;
  pool.forEach(w=>w.terminate());
  showErr(error);
  return;
}
pool.forEach(w=>w.terminate());

statusEl.textContent="Launching…";
const list=Array.from({length:expectedCount},(_,i)=>parts.get(i));

const inPlace=async()=>{
  statusEl.textContent="Launching in place…";
  const dec=new TextDecoder("utf-8");
  document.open();
  for(let i=0;i<list.length;i++){
    document.write(dec.decode(new Uint8Array(await list[i].arrayBuffer()),{stream:i<list.length-1}));
    list[i]=null;
  }
  document.close();
};

const mode=new URLSearchParams(location.search).get("mode");
if(mode==="write"){await inPlace();return}

const blobList=list.slice();
if(mode!=="nobase"){
  try{
    const first=list[0];
    const head=await first.slice(0,65536).text();
    const m=/<head[^>]*>/i.exec(head)||/<html[^>]*>/i.exec(head);
    if(m&&!/<base[\s>]/i.test(head)){
      const at=new TextEncoder().encode(head.slice(0,m.index+m[0].length)).length;
      const tag='<base href="'+new URL(".",location.href).href+'">';
      blobList[0]=new Blob([first.slice(0,at),tag,first.slice(at)]);
    }
  }catch(e){}
}
location.replace(URL.createObjectURL(new Blob(blobList,{type:"text/html;charset=utf-8"})));

setTimeout(()=>{
  const btn=document.createElement("button");
  btn.textContent="Stuck? Launch in place";
  btn.style.cssText="margin-top:8px;padding:8px 14px;background:#222;color:#fff;border:1px solid #444;border-radius:6px;cursor:pointer";
  btn.onclick=()=>{btn.remove();inPlace().catch(showErr)};
  document.querySelector(".loader").appendChild(btn);
},6000);
})();
</script>
</body>
</html>
